<title>PDCA</title>
<style>
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --label:#1C1C1E;
  --secondary-label:#8E8E93;
  --tertiary-label:#C7C7CC;
  --separator:#E5E5EA;
  --blue:#007AFF;
  --plan:#FF9500;   /* systemOrange */
  --do:#32ADE6;     /* systemTeal   */
  --check:#AF52DE;  /* systemPurple */
  --act:#5856D6;    /* systemIndigo */
  --plan-bg:#FFF3E0;
  --do-bg:#E4F5FC;
  --check-bg:#F5E9FA;
  --act-bg:#E9E8FB;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  color:var(--label);
  -webkit-font-smoothing:antialiased;
}
.screen{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
}
@media (min-width:431px){
  .screen{
    box-shadow:0 0 60px rgba(0,0,0,0.08);
    min-height:100vh;
  }
}

/* ---------- Large title nav ---------- */
.navbar{
  position:sticky;top:0;z-index:30;
  padding:calc(env(safe-area-inset-top) + 8px) 20px 6px;
  background:rgba(242,242,247,0.85);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:0.5px solid var(--separator);
}
.navbar .large-title{
  font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
}
.navbar .subtitle{
  font-size:13px;color:var(--secondary-label);margin-top:1px;
}

/* ---------- Latest action widget ---------- */
.widget{
  margin:14px 16px 4px;
  padding:14px 16px;
  border-radius:var(--radius-lg);
  background:linear-gradient(135deg,#26234F,#3B3570);
  color:#fff;
  box-shadow:0 8px 20px rgba(30,20,70,0.25);
}
.widget .row{display:flex;align-items:center;gap:6px;}
.widget .row svg{width:14px;height:14px;color:#B9B6E8;flex:none;}
.widget .eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.04em;color:#B9B6E8;text-transform:uppercase;
}
.widget .action-text{
  font-size:16px;font-weight:600;line-height:1.4;margin-top:6px;letter-spacing:-.01em;
}
.widget.empty .action-text{font-weight:400;color:#D8D6EE;}
.widget .action-date{
  font-size:12px;color:#B9B6E8;margin-top:6px;
}

/* ---------- Activity rings ---------- */
.ring-card{
  margin:12px 16px 4px;
  padding:16px;
  border-radius:var(--radius-lg);
  background:var(--card);
  display:flex;align-items:center;gap:16px;
}
.ring-card svg{width:92px;height:92px;flex:none;}
.ring-legend{flex:1;display:flex;flex-direction:column;gap:6px;}
.ring-legend .item{display:flex;align-items:center;gap:8px;font-size:13px;}
.ring-legend .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.ring-legend .item span.name{color:var(--label);font-weight:500;}
.ring-legend .item span.state{margin-left:auto;color:var(--tertiary-label);font-size:12px;}
.ring-legend .item.filled span.state{color:var(--secondary-label);}

/* ---------- Day picker (Calendar-style) ---------- */
.day-picker{
  margin:16px 0 4px;
  padding:0 16px;
}
.day-picker-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2px 8px;
}
.day-picker-head .label{font-size:13px;color:var(--secondary-label);font-weight:500;}
.day-picker-head button{
  border:none;background:transparent;color:var(--blue);font-size:14px;font-weight:500;
  padding:4px 6px;cursor:pointer;
}
.day-strip{
  display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;
  scrollbar-width:none;
}
.day-strip::-webkit-scrollbar{display:none;}
.day-chip{
  flex:none;width:46px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:8px 0;border-radius:16px;cursor:pointer;
  transition:transform .12s ease;
}
.day-chip:active{transform:scale(0.93);}
.day-chip .dow{font-size:11px;color:var(--secondary-label);font-weight:500;}
.day-chip .num-wrap{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:var(--label);
}
.day-chip.selected .num-wrap{background:var(--blue);color:#fff;}
.day-chip.today:not(.selected) .num-wrap{color:var(--blue);}
.day-chip .dots{display:flex;gap:2.5px;}
.day-chip .dots span{width:4px;height:4px;border-radius:50%;background:var(--tertiary-label);}
.day-chip .dots span.on.p{background:var(--plan);}
.day-chip .dots span.on.d{background:var(--do);}
.day-chip .dots span.on.c{background:var(--check);}
.day-chip .dots span.on.a{background:var(--act);}

.date-jump{
  display:flex;align-items:center;gap:8px;padding:2px 2px 2px;
}
.date-jump input[type=date]{
  font-family:inherit;font-size:14px;color:var(--label);
  border:none;background:var(--card);border-radius:var(--radius-sm);
  padding:8px 10px;flex:1;
}

/* ---------- Sections (grouped list feel) ---------- */
.section{margin:18px 16px 0;}
.section-label{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--secondary-label);
  text-transform:uppercase;padding:0 4px 6px;
}
.section-label .dot{width:8px;height:8px;border-radius:50%;}
.section-label .mode-toggle{
  margin-left:auto;display:flex;background:#E5E5EA;border-radius:8px;padding:2px;gap:2px;
}
.section-label .mode-btn{
  border:none;background:transparent;color:var(--secondary-label);
  font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;
  padding:4px 9px;border-radius:6px;cursor:pointer;
}
.section-label .mode-btn.active{background:#fff;color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,0.12);}
.section-card{
  background:var(--card);border-radius:var(--radius-md);
  padding:2px;
}
.section-card textarea{
  width:100%;border:none;background:transparent;resize:none;
  font-family:inherit;font-size:16px;line-height:1.5;color:var(--label);
  padding:12px 12px;min-height:76px;border-radius:var(--radius-md);
}
.section-card textarea:focus{outline:none;background:#FAFAFB;}
.section-card textarea::placeholder{color:var(--tertiary-label);}

/* ---------- Fixed bottom save bar ---------- */
.bottom-bar{
  position:sticky;bottom:0;z-index:30;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);
  background:rgba(242,242,247,0.85);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:0.5px solid var(--separator);
  margin-top:22px;
}
.save-btn{
  width:100%;border:none;border-radius:14px;
  background:var(--blue);color:#fff;font-size:17px;font-weight:600;
  padding:14px 0;cursor:pointer;
  transition:transform .1s ease, background .1s ease;
}
.save-btn:active{transform:scale(0.97);background:#0062CC;}
.action-row{display:flex;gap:8px;}
.action-row .save-btn{flex:1;}
.icon-btn{
  flex:none;width:52px;border:none;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .1s ease;
  background:var(--card);color:var(--blue);
}
.icon-btn svg{width:21px;height:21px;}
.icon-btn:active{transform:scale(0.93);}
.icon-btn.line-btn{background:#E8FBF0;color:#06C755;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;
  transform:translateX(-50%) translateY(-140%);
  background:rgba(28,28,30,0.92);color:#fff;
  padding:10px 18px;border-radius:14px;font-size:14px;font-weight:500;
  display:flex;align-items:center;gap:8px;
  transition:transform .35s cubic-bezier(.32,.9,.4,1.2);
  z-index:50;backdrop-filter:blur(10px);
}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast svg{width:16px;height:16px;color:#34C759;}

/* ---------- History ---------- */
.history-wrap{margin:20px 16px 24px;}
.history-head{
  font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--secondary-label);
  text-transform:uppercase;padding:0 4px 6px;
}
.history-card{background:var(--card);border-radius:var(--radius-md);overflow:hidden;}
.hist-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-bottom:0.5px solid var(--separator);cursor:pointer;
}
.hist-row:last-child{border-bottom:none;}
.hist-row:active{background:#F5F5F7;}
.hist-row .hd{
  font-size:14px;font-weight:600;color:var(--label);width:52px;flex:none;
}
.hist-row .hc{
  font-size:13px;color:var(--secondary-label);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.hist-row .chev{width:8px;height:8px;flex:none;color:var(--tertiary-label);}
.hist-empty{
  padding:16px 14px;font-size:14px;color:var(--secondary-label);text-align:center;
}

/* ---------- Firebase account ---------- */
.auth-card{margin:0 16px 14px;padding:12px 14px;background:var(--card);border-radius:var(--radius-md);display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.auth-copy{min-width:0;flex:1}.auth-name{font-size:14px;font-weight:700;color:var(--label);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.auth-status{font-size:12px;color:var(--secondary-label);margin-top:2px}
.auth-btn{border:0;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;background:#26234F;color:#fff;white-space:nowrap}.auth-btn.secondary{background:#ECECF2;color:#26234F}.auth-btn:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtWpFPPtzY5nHcoeChH7D7zmxTneVcCOw",
  authDomain: "pdca-term.firebaseapp.com",
  projectId: "pdca-term",
  storageBucket: "pdca-term.firebasestorage.app",
  messagingSenderId: "855752658794",
  appId: "1:855752658794:web:4b06a6d0fb37412e88df13",
  measurementId: "G-YD2J3PHZYD"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

let currentUser = null;
let resolveAuth;
const authReady = new Promise(resolve => { resolveAuth = resolve; });

window.firebaseBridge = {
  authReady,
  get user(){ return currentUser; },
  async login(){ return signInWithPopup(auth, provider); },
  async logout(){ return signOut(auth); },
  async loadCloud(){
    if(!currentUser) return null;
    const snap = await getDoc(doc(db, "users", currentUser.uid));
    return snap.exists() ? snap.data() : null;
  },
  async saveCloud(data){
    if(!currentUser) return;
    await setDoc(doc(db, "users", currentUser.uid), {
      entries: data.entries || {},
      displayName: currentUser.displayName || "",
      email: currentUser.email || "",
      photoURL: currentUser.photoURL || "",
      updatedAt: serverTimestamp()
    }, { merge: true });
  }
};

onAuthStateChanged(auth, user => {
  currentUser = user;
  window.dispatchEvent(new CustomEvent("pdca-auth-changed", { detail: { user } }));
  resolveAuth(user);
});
</script>

<script>
const STORAGE_KEY = 'pdca-data';
let state = { entries: {} };
let currentDate = todayStr();
const FIELD_IDS = { plan:'planInput', do:'doInput', check:'checkInput', act:'actInput' };
let fieldModes = { plan:'text', do:'text', check:'text', act:'text' };

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return `${m}月${d}日`;
}
function dowLabel(dateStr){
  const dow = ['日','月','火','水','木','金','土'];
  const dt = new Date(dateStr+'T00:00:00');
  return dow[dt.getDay()];
}
function monthLabel(dateStr){
  const [y,m] = dateStr.split('-').map(Number);
  return `${y}年${m}月`;
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      if(!state.entries) state.entries = {};
    }
  }catch(e){
    state = { entries: {} };
  }

  try{
    if(window.firebaseBridge){
      await window.firebaseBridge.authReady;
      const cloud = await window.firebaseBridge.loadCloud();
      if(cloud && cloud.entries){
        state = { entries: cloud.entries };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
    }
  }catch(e){
    console.error('cloud load failed', e);
    showToast('クラウド読込に失敗しました');
  }
}
async function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if(window.firebaseBridge && window.firebaseBridge.user){
      await window.firebaseBridge.saveCloud(state);
    }
  }catch(e){
    console.error('storage save failed', e);
    throw e;
  }
}

function getLatestAction(){
  const dates = Object.keys(state.entries)
    .filter(d => (state.entries[d].act||'').trim() !== '')
    .sort().reverse();
  if(dates.length === 0) return null;
  return { date: dates[0], text: state.entries[dates[0]].act };
}

function renderWidget(){
  const el = document.getElementById('widget');
  const latest = getLatestAction();
  if(!latest){
    el.classList.add('empty');
    document.getElementById('actionText').textContent = 'まだ記録がありません。今日のPlan〜Actを入力してみましょう。';
    document.getElementById('actionDate').textContent = '';
  }else{
    el.classList.remove('empty');
    document.getElementById('actionText').textContent = latest.text;
    document.getElementById('actionDate').textContent = fmtLabel(latest.date) + ' のActより';
  }
}

function dateRange(){
  const dates = [];
  const base = new Date(todayStr()+'T00:00:00');
  for(let i=13;i>=0;i--){
    const d = new Date(base);
    d.setDate(d.getDate()-i);
    dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  if(!dates.includes(currentDate)){
    dates.push(currentDate);
    dates.sort();
  }
  return dates;
}

function renderDayStrip(){
  document.getElementById('monthLabel').textContent = monthLabel(currentDate);
  const strip = document.getElementById('dayStrip');
  strip.innerHTML = '';
  const today = todayStr();
  dateRange().forEach(dateStr=>{
    const entry = state.entries[dateStr] || {};
    const chip = document.createElement('div');
    chip.className = 'day-chip'
      + (dateStr===currentDate ? ' selected':'')
      + (dateStr===today ? ' today':'');
    const [,,d] = dateStr.split('-');
    chip.innerHTML = `
      <div class="dow">${dowLabel(dateStr)}</div>
      <div class="num-wrap">${parseInt(d,10)}</div>
      <div class="dots">
        <span class="${entry.plan? 'on p':''}"></span>
        <span class="${entry.do? 'on d':''}"></span>
        <span class="${entry.check? 'on c':''}"></span>
        <span class="${entry.act? 'on a':''}"></span>
      </div>`;
    chip.addEventListener('click', ()=> selectDate(dateStr));
    strip.appendChild(chip);
  });
  const sel = strip.querySelector('.selected');
  if(sel) sel.scrollIntoView({inline:'center', block:'nearest'});
}

function loadFieldsForCurrentDate(){
  const entry = state.entries[currentDate] || {};
  document.getElementById('planInput').value = entry.plan || '';
  document.getElementById('doInput').value = entry.do || '';
  document.getElementById('checkInput').value = entry.check || '';
  document.getElementById('actInput').value = entry.act || '';
  document.getElementById('datePicker').value = currentDate;

  const modes = entry.modes || {};
  Object.keys(FIELD_IDS).forEach(field=>{
    fieldModes[field] = modes[field] || 'text';
    updateModeButtons(field);
  });
}

function updateModeButtons(field){
  const toggle = document.querySelector(`.mode-toggle[data-field="${field}"]`);
  if(!toggle) return;
  toggle.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.mode === fieldModes[field]);
  });
}

// Prefix every non-empty line that doesn't already start with a bullet mark
function toBulletText(text){
  return text.split('\n').map(line=>{
    if(line.trim() === '' || line.trimStart().startsWith('・')) return line;
    return '・ ' + line;
  }).join('\n');
}

function setFieldMode(field, mode){
  if(fieldModes[field] === mode) return;
  fieldModes[field] = mode;
  updateModeButtons(field);
  const el = document.getElementById(FIELD_IDS[field]);
  if(mode === 'bullet' && el.value.trim() !== ''){
    el.value = toBulletText(el.value);
  }
}

// Auto-continue bullet lines: pressing Enter starts the next line with "・ "
function attachBulletAutoContinue(field){
  const el = document.getElementById(FIELD_IDS[field]);
  el.addEventListener('keydown', (e)=>{
    if(e.key !== 'Enter' || fieldModes[field] !== 'bullet') return;
    e.preventDefault();
    const start = el.selectionStart, end = el.selectionEnd;
    const before = el.value.slice(0, start);
    const lastLine = before.split('\n').pop();
    const insert = (lastLine.trim() === '・' || lastLine.trim() === '') ? '\n' : '\n・ ';
    el.value = el.value.slice(0, start) + insert + el.value.slice(end);
    const pos = start + insert.length;
    el.selectionStart = el.selectionEnd = pos;
  });
}

document.querySelectorAll('.mode-toggle').forEach(toggle=>{
  const field = toggle.dataset.field;
  toggle.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> setFieldMode(field, btn.dataset.mode));
  });
  attachBulletAutoContinue(field);
});

function renderRing(){
  const entry = state.entries[currentDate] || {};
  const cx = 65, cy = 65;
  const rings = [
    { key:'plan',  r:52, color:'var(--plan)',  name:'Plan'  },
    { key:'do',    r:40, color:'var(--do)',    name:'Do'    },
    { key:'check', r:28, color:'var(--check)', name:'Check' },
    { key:'act',   r:16, color:'var(--act)',   name:'Act'   }
  ];
  let svgHtml = '';
  rings.forEach(rg=>{
    const filled = !!entry[rg.key];
    svgHtml += `<circle cx="${cx}" cy="${cy}" r="${rg.r}" stroke="${filled ? rg.color : '#E5E5EA'}" stroke-width="9" fill="none" stroke-linecap="round" opacity="${filled?1:0.9}"/>`;
  });
  document.getElementById('ringSvg').innerHTML = svgHtml;

  const legend = document.getElementById('ringLegend');
  legend.innerHTML = rings.map(rg=>{
    const filled = !!entry[rg.key];
    return `<div class="item ${filled?'filled':''}">
      <span class="dot" style="background:${filled ? rg.color : '#E5E5EA'}"></span>
      <span class="name">${rg.name}</span>
      <span class="state">${filled ? '記入済み' : '未記入'}</span>
    </div>`;
  }).join('');
}

function renderHistory(){
  const list = document.getElementById('historyList');
  const dates = Object.keys(state.entries).sort().reverse();
  if(dates.length === 0){
    list.innerHTML = '<div class="hist-empty">まだ記録がありません</div>';
    return;
  }
  list.innerHTML = '';
  dates.forEach(dateStr=>{
    const e = state.entries[dateStr];
    const preview = e.act || e.check || e.do || e.plan || '';
    const row = document.createElement('div');
    row.className = 'hist-row';
    row.innerHTML = `
      <div class="hd">${fmtLabel(dateStr)}</div>
      <div class="hc">${preview || '記入なし'}</div>
      <svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l6 6-6 6"/></svg>`;
    row.addEventListener('click', ()=> selectDate(dateStr));
    list.appendChild(row);
  });
}

function selectDate(dateStr){
  currentDate = dateStr;
  loadFieldsForCurrentDate();
  renderDayStrip();
  renderRing();
}

let toastTimer;
function showToast(message){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = message || '保存しました';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 1800);
}

async function saveCurrentDate(){
  const entry = {
    plan: document.getElementById('planInput').value.trim(),
    do: document.getElementById('doInput').value.trim(),
    check: document.getElementById('checkInput').value.trim(),
    act: document.getElementById('actInput').value.trim(),
    modes: { ...fieldModes },
    updatedAt: Date.now()
  };
  state.entries[currentDate] = entry;
  await persist();
  renderWidget();
  renderDayStrip();
  renderRing();
  renderHistory();
  showToast('保存しました');
}

function buildShareText(){
  const entry = state.entries[currentDate] || {};
  const sections = [
    { key:'plan',  title:'📋 Plan（計画）' },
    { key:'do',    title:'▶️ Do（実行）'  },
    { key:'check', title:'🔍 Check（検証）'},
    { key:'act',   title:'✅ Act（改善）'  }
  ];
  const lines = [`【PDCA】${fmtLabel(currentDate)}`, ''];
  sections.forEach(s=>{
    lines.push(s.title);
    lines.push((entry[s.key] || '').trim() || '（未記入）');
    lines.push('');
  });
  return lines.join('\n').trim();
}

async function shareGeneric(){
  const text = buildShareText();
  if(navigator.share){
    try{
      await navigator.share({ title: 'PDCA ' + fmtLabel(currentDate), text });
    }catch(e){ /* user cancelled - do nothing */ }
  }else{
    try{
      await navigator.clipboard.writeText(text);
      showToast('コピーしました。LINEなどに貼り付けてください');
    }catch(e){
      showToast('コピーに失敗しました');
    }
  }
}

function shareToLine(){
  const text = buildShareText();
  const url = 'https://line.me/R/msg/text/?' + encodeURIComponent(text);
  window.open(url, '_blank');
}

function updateAuthUI(user){
  const name = document.getElementById('authName');
  const status = document.getElementById('authStatus');
  const btn = document.getElementById('authBtn');
  if(user){
    name.textContent = user.displayName || user.email || 'ログイン中';
    status.textContent = 'クラウド同期中';
    btn.textContent = 'ログアウト';
    btn.classList.add('secondary');
  }else{
    name.textContent = 'ゲスト利用中';
    status.textContent = 'この端末に保存されます';
    btn.textContent = 'Googleでログイン';
    btn.classList.remove('secondary');
  }
}

window.addEventListener('pdca-auth-changed', async (event)=>{
  updateAuthUI(event.detail.user);
  if(event.detail.user){
    await loadData();
    renderWidget(); renderDayStrip(); loadFieldsForCurrentDate(); renderRing(); renderHistory();
  }
});

document.getElementById('authBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('authBtn');
  btn.disabled = true;
  try{
    if(window.firebaseBridge.user){
      await window.firebaseBridge.logout();
      showToast('ログアウトしました');
    }else{
      await window.firebaseBridge.login();
      showToast('ログインしました');
    }
  }catch(e){
    console.error(e);
    showToast(e.code === 'auth/popup-closed-by-user' ? 'ログインを中止しました' : 'ログインに失敗しました');
  }finally{
    btn.disabled = false;
  }
});

document.getElementById('saveBtn').addEventListener('click', saveCurrentDate);
document.getElementById('shareBtn').addEventListener('click', shareGeneric);
document.getElementById('lineBtn').addEventListener('click', shareToLine);
document.getElementById('jumpToday').addEventListener('click', ()=> selectDate(todayStr()));
document.getElementById('datePicker').addEventListener('change', (e)=>{
  if(e.target.value) selectDate(e.target.value);
});

(async function init(){
  updateAuthUI(null);
  await loadData();
  renderWidget();
  renderDayStrip();
  loadFieldsForCurrentDate();
  renderRing();
  renderHistory();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
